services:
  - type: web
    name: t4traveling-frontend
    runtime: static
    buildCommand: npm ci --include=dev && npm run build:prod
    staticPublishPath: dist/t4traveling/browser
    # Variables de entorno para el build
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NPM_VERSION
        value: 10.9.2
    # Headers de seguridad y caché
    headers:
      # Headers de seguridad para todas las rutas
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-XSS-Protection
        value: "1; mode=block"
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: geolocation=(), microphone=(), camera=()
      # Caché para imágenes
      - path: /images/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # Caché para archivos JavaScript
      - path: /*.js
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # Caché para archivos CSS
      - path: /*.css
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # Caché para fuentes
      - path: /*.woff2
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*.woff
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*.ttf
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # Sin caché para el index.html (para actualizaciones)
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
    # Redirecciones para SPA routing - todas las rutas deben devolver index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

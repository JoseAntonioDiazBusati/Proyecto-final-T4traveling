@if (isGlobalLoading()) {
  <div class="loading-overlay" role="status" aria-live="polite" aria-busy="true">
    <div class="loading-spinner">
      <div class="spinner">
        <div class="spinner__circle"></div>
        <div class="spinner__circle"></div>
        <div class="spinner__circle"></div>
        <div class="spinner__circle"></div>
      </div>
      <p class="loading-message">{{ loadingMessage }}</p>
    </div>
  </div>
}

<!-- Página de inicio - T4 Traveling -->
<main class="home">
  <!-- Sección Hero -->
  <section class="hero">
    <div class="hero__content">
      <h1>Descubre el mundo con T4 Traveling</h1>
      <p>Explora destinos únicos y vive experiencias inolvidables</p>
      <nav class="hero__actions" aria-label="Acciones principales">
        <a routerLink="/destinos" class="btn btn--primary">Explorar destinos</a>
      </nav>
    </div>
  </section>

  <!-- Sección de destinos destacados -->
  <section class="featured" aria-labelledby="featured-heading">
    <h2 id="featured-heading">Destinos destacados</h2>
    <div class="featured__grid">
      <article *ngFor="let d of featuredDestinations; let i = index" class="card">
        <figure class="card__image">
          <img
            [src]="d.image"
            [alt]="'Imagen destacada de ' + d.name + ', ' + d.country + ' - ' + d.description"
            [attr.fetchpriority]="i === 0 ? 'high' : null"
            [attr.loading]="i === 0 ? 'eager' : 'lazy'"
            width="400"
            height="300"
            decoding="async" />
        </figure>
        <section class="card__content">
          <h3>{{ d.name }}</h3>
          <p>{{ d.country }}</p>
          <data class="price" [value]="d.price">{{ d.price | currency:'EUR' }}</data>
          <a [routerLink]="['/destinos', d.id]" class="btn btn--sm">Ver detalles</a>
        </section>
      </article>
    </div>
  </section>
</main>

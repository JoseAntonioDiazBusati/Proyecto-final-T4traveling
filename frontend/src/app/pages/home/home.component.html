<!-- Página de inicio - T4 Traveling -->
<div class="home">
  <!-- Sección Hero -->
  <section class="hero">
    <div class="hero__content">
      <h1>Descubre el mundo con T4 Traveling</h1>
      <p>Explora destinos únicos y vive experiencias inolvidables</p>
      <div class="hero__actions">
        <a routerLink="/destinos" class="btn btn--primary">Explorar destinos</a>
      </div>
    </div>
  </section>

  <!-- Sección de destinos destacados -->
  <section class="featured">
    <h2>Destinos destacados</h2>
    <div class="featured__grid">
      <article *ngFor="let d of featuredDestinations" class="card">
        <div class="card__image">
          <img [src]="d.image" [alt]="d.name" />
        </div>
        <div class="card__content">
          <h3>{{ d.name }}</h3>
          <p>{{ d.country }}</p>
          <span class="price">{{ d.price | currency:'EUR' }}</span>
          <a [routerLink]="['/destinos', d.id]" class="btn btn--sm">Ver detalles</a>
        </div>
      </article>
    </div>
  </section>
</div>

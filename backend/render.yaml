services:
  - type: web
    name: t4traveling-backend
    runtime: java
    env: java
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -Dserver.port=$PORT -Dspring.profiles.active=prod -jar target/backend-0.0.1-SNAPSHOT.jar
    # Variables de entorno para la aplicación
    envVars:
      - key: JAVA_VERSION
        value: 21
      - key: MAVEN_VERSION
        value: 3.9.5
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Database Configuration (estas deben configurarse en el dashboard de Render)
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      # JWT Configuration
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 86400000
      # Spring Boot Configuration
      - key: SERVER_PORT
        value: 8080
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: SPRING_JPA_SHOW_SQL
        value: false
      # CORS Configuration (ajustar según el dominio del frontend)
      - key: CORS_ALLOWED_ORIGINS
        value: https://t4traveling-frontend.onrender.com,http://localhost:4200
    # Health check para verificar que la aplicación está corriendo
    healthCheckPath: /actuator/health
    # Configuración de recursos
    plan: free

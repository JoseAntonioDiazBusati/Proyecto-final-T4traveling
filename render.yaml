services:
  - type: web
    name: proyecto-final-t4traveling
    runtime: static
    buildCommand: npm ci --include=dev && npm run build:prod
    rootDir: frontend
    staticPublishPath: dist/t4traveling/browser
    # Variables de entorno para el build
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NPM_VERSION
        value: 10.9.2
    # Headers de seguridad y caché
    headers:
      # Headers de seguridad para todas las rutas
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-XSS-Protection
        value: "1; mode=block"
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # Caché para imágenes (ahora en /images/* no /assets/*)
      - path: /images/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # Caché para archivos JavaScript
      - path: /*.js
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # Caché para archivos CSS
      - path: /*.css
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # Caché para fuentes
      - path: /*.woff2
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # Sin caché para el index.html (para actualizaciones)
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
    # Redirecciones manejadas por _redirects (SPA routing)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html


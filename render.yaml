services:
  # Backend - Spring Boot API
  - type: web
    name: t4traveling-backend
    runtime: java
    rootDir: backend
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -Dserver.port=$PORT -Dspring.profiles.active=prod -jar target/backend-0.0.1-SNAPSHOT.jar
    envVars:
      - key: JAVA_VERSION
        value: 21
      - key: MAVEN_VERSION
        value: 3.9.5
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Database Configuration
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      # JWT Configuration
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 86400000
      # Spring Boot Configuration
      - key: SERVER_PORT
        value: 8080
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: SPRING_JPA_SHOW_SQL
        value: false
      # CORS Configuration
      - key: CORS_ALLOWED_ORIGINS
        value: https://t4traveling-frontend.onrender.com,http://localhost:4200
    healthCheckPath: /actuator/health
    plan: free

  # Frontend - Node.js Web Service
  - type: web
    name: t4traveling-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm ci && npm run build:prod
    startCommand: npm run start:prod
    envVars:
      - key: NODE_VERSION
        value: "20"
    plan: free

services:
  # Backend API - Spring Boot (Web Service con Docker)
  - type: web
    name: t4traveling-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend/
    region: frankfurt
    plan: free
    healthCheckPath: /actuator/health
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: SPRING_DATASOURCE_URL
        value: jdbc:h2:file:/data/t4traveling;MODE=MySQL;AUTO_SERVER=TRUE
      - key: SPRING_DATASOURCE_DRIVERNAME
        value: org.h2.Driver
      - key: SPRING_DATASOURCE_USERNAME
        value: sa
      - key: SPRING_H2_CONSOLE_ENABLED
        value: "true"
      - key: SPRING_JPA_DATABASE_PLATFORM
        value: org.hibernate.dialect.H2Dialect
      # JWT Configuration
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: "86400000"
      # CORS Configuration
      - key: CORS_ALLOWED_ORIGINS
        value: https://t4traveling-frontend.onrender.com,http://localhost:4200
    disk:
      name: backend-data
      mountPath: /data
      sizeGB: 1

# Frontend - Static Site (configurar manualmente en Render)
# Nombre: t4traveling-frontend
# Build Command: npm install && npm run build:prod
# Publish Directory: frontend/dist/t4traveling/browser
